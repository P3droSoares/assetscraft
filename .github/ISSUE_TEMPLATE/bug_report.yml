name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you clicked or asked, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AssetsCraft version
      placeholder: v0.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, Other]
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Drag images here. Error text from the chat helps a lot.
